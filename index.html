<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142b40"><title>食費予算管理</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#183047;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#142b40;color:white;padding:24px 16px}header .wrap{max-width:980px;margin:auto}h1{margin:0;font-size:1.45rem}header p{margin:8px 0 0;color:#d1e0eb;font-size:.9rem}.wrap{max-width:980px;margin:auto;padding:0 14px}main{padding-top:18px;padding-bottom:70px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 3px 14px #1b3d5c12}h2{font-size:1.08rem;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:650}.field input{width:100%;border:1px solid #c8d5e0;border-radius:9px;padding:12px;font-size:1rem;background:white;color:#142b40}input:focus{outline:2px solid #2e81ca;outline-offset:1px}.hint{color:#607488;font-size:.82rem;margin:12px 0 0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:13px;background:#eff5fb;border-radius:12px}.stat small{display:block;color:#51697e;margin-bottom:5px}.stat strong{font-size:1.3rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.stat.wide{grid-column:1/-1;background:#e1f3eb}.stat.danger{background:#ffe4e2;color:#a51f20}.status{margin:12px 0 0;font-weight:700;color:#247251}.status.bad{color:#b42325}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}button{font:inherit;border:0;border-radius:9px;padding:10px 13px;background:#1765a2;color:white;cursor:pointer;font-weight:650}button.secondary{background:#e6eef5;color:#224b6c}button.delete{background:#fff0f0;color:#ac2b2b;padding:9px 11px}button:focus-visible{outline:3px solid #ec9c35}.day{padding:0;overflow:hidden}.dayhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;background:#e9f2fa;cursor:pointer;list-style:none;font-weight:750}.dayhead::-webkit-details-marker{display:none}.dayhead:after{content:'⌄';font-size:1.3rem}.day[open] .dayhead:after{content:'⌃'}.daybody{padding:14px}.meal{border:1px solid #dae4ed;border-radius:12px;padding:13px;margin-bottom:12px}.meal:last-child{margin-bottom:0}.mealhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:750}.items{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,125px) auto;gap:7px;align-items:center}.item input{width:100%;padding:10px;border:1px solid #c8d5e0;border-radius:8px;font-size:16px}.item input[type=number]{text-align:right}.add{margin-top:10px}.daytotal{font-variant-numeric:tabular-nums;color:#155f96}.empty{text-align:center;padding:24px;color:#66798b}.summary{width:100%;border-collapse:collapse;font-size:.9rem}th,td{border-bottom:1px solid #e2eaf0;padding:10px 5px;text-align:right;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}tfoot td{font-weight:800;background:#edf5fc}.scroll{overflow-x:auto}.foot{color:#6b7d8c;text-align:center;font-size:.77rem;margin-top:25px}@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}.stat.wide{grid-column:auto}.daybody{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.meal{margin:0}.item{grid-template-columns:minmax(0,1fr) minmax(70px,90px) auto}.item input{min-width:0}}
</style>
</head>
<body><header><div class="wrap"><h1>🍱 食費予算管理</h1><p>期間を指定して、朝・昼・夕の支出を自動集計</p></div></header>
<main class="wrap">
<section class="card"><h2>① 期間と予算</h2><div class="grid"><label class="field">開始日<input id="start" type="date"></label><label class="field">終了日<input id="end" type="date"></label><label class="field">受領金額<input id="received" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例：115"></label><label class="field">使用予定金額<input id="budget" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例：113"></label></div><p class="hint">金額の単位は自由です（円・ドルなど）。期間変更後も、同じ日付の入力データは保持されます。</p></section>
<section class="card"><h2>② 全期間の集計</h2><div class="stats"><div class="stat"><small>受領金額</small><strong id="sReceived">0</strong></div><div class="stat"><small>使用予定金額</small><strong id="sBudget">0</strong></div><div class="stat"><small>使用済金額</small><strong id="sSpent">0</strong></div><div class="stat wide" id="remainingBox"><small>使用可能残高</small><strong id="sRemaining">0</strong></div><div class="stat"><small>返納予定額</small><strong id="sReturn">0</strong></div><div class="stat"><small>対象日数</small><strong id="sDays">0日</strong></div></div><p class="status" id="status" role="status"></p></section>
<section><h2>③ 日付別の入力</h2><div id="days"></div></section>
<section class="card"><h2>④ 日別集計表</h2><div class="scroll"><table class="summary"><thead><tr><th>日付</th><th>朝食</th><th>昼食</th><th>夕食</th><th>日計</th></tr></thead><tbody id="summaryBody"></tbody><tfoot><tr><td>総合計</td><td id="tMorning">0</td><td id="tLunch">0</td><td id="tDinner">0</td><td id="tAll">0</td></tr></tfoot></table></div><div class="toolbar"><button id="csv">CSV出力</button><button class="secondary" id="backup">JSONバックアップ</button><button class="secondary" id="restore">JSON読込</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button class="delete" id="reset">全データ削除</button></div><p class="hint">データはこの端末のブラウザ内に保存されます。別端末への移行にはJSONバックアップをご利用ください。</p></section><p class="foot">オフライン動作対応・外部送信なし・GitHub Pages対応</p>
</main>
<script>
(()=>{'use strict';
const KEY='meal-budget-v2',MEALS=[['morning','朝食'],['lunch','昼食'],['dinner','夕食']];
const $=id=>document.getElementById(id),fmt=n=>(Math.round(n*100)/100).toLocaleString('ja-JP',{maximumFractionDigits:2});
const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);const x=new Date(y,m-1,d,12);return x.getFullYear()===y&&x.getMonth()===m-1&&x.getDate()===d?x:null};
const today=new Date(),defaultStart=localDate(today),defaultEnd=localDate(new Date(today.getFullYear(),today.getMonth(),today.getDate()+2));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};
if(!state||typeof state!=='object'||!state.days)state={start:defaultStart,end:defaultEnd,received:'',budget:'',days:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{ $('status').textContent='保存に失敗しました。ブラウザの空き容量をご確認ください。';}};
const amount=x=>{const n=Number(x);return Number.isFinite(n)&&n>0?n:0};
const dates=()=>{const a=parseDate(state.start),b=parseDate(state.end);if(!a||!b||a>b)return[];const diff=Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/86400000);if(diff>365)return[];return Array.from({length:diff+1},(_,i)=>localDate(new Date(a.getFullYear(),a.getMonth(),a.getDate()+i,12)))};
const items=(date,meal)=>{state.days[date]??={};state.days[date][meal]??=[];return state.days[date][meal]};
const subtotal=(date,meal)=>items(date,meal).reduce((s,x)=>s+amount(x.price),0);
const labelDate=s=>{const d=parseDate(s);return `${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`};
const element=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e};
function renderDays(){const root=$('days');root.replaceChildren();const list=dates();if(!list.length){root.append(element('div','card empty','期間が正しくありません。開始日 ≤ 終了日、最大366日で指定してください。'));return}
for(const date of list){const detail=element('details','card day');detail.open=list.length<=4;const head=element('summary','dayhead');head.append(element('span','',labelDate(date)));const total=element('span','daytotal');total.dataset.total=date;head.append(total);detail.append(head);const body=element('div','daybody');for(const [key,title] of MEALS){const meal=element('section','meal'),mh=element('div','mealhead');mh.append(element('span','',title));const st=element('span','');st.dataset.subtotal=`${date}:${key}`;mh.append(st);meal.append(mh);const rows=element('div','items');for(const item of items(date,key))rows.append(makeRow(date,key,item));meal.append(rows);const add=element('button','secondary add','＋ 商品を追加');add.type='button';add.addEventListener('click',()=>{const obj={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name:'',price:''};items(date,key).push(obj);rows.append(makeRow(date,key,obj));save();update();rows.lastChild.querySelector('input').focus()});meal.append(add);body.append(meal)}detail.append(body);root.append(detail)}update()}
function makeRow(date,meal,item){const row=element('div','item'),name=element('input'),price=element('input'),del=element('button','delete','×');name.type='text';name.placeholder='商品名';name.setAttribute('aria-label',`${date} ${meal} 商品名`);name.value=String(item.name??'');price.type='number';price.min='0';price.step='0.01';price.inputMode='decimal';price.placeholder='価格';price.setAttribute('aria-label',`${date} ${meal} 価格`);price.value=item.price??'';name.addEventListener('input',()=>{item.name=name.value;save()});price.addEventListener('input',()=>{item.price=price.value;save();update()});del.type='button';del.setAttribute('aria-label','商品を削除');del.addEventListener('click',()=>{const arr=items(date,meal),idx=arr.indexOf(item);if(idx>=0)arr.splice(idx,1);row.remove();save();update()});row.append(name,price,del);return row}
function update(){const list=dates();let sums=[0,0,0],spent=0;const body=$('summaryBody');body.replaceChildren();for(const date of list){const vals=MEALS.map(([k])=>subtotal(date,k)),total=vals.reduce((a,b)=>a+b,0);vals.forEach((v,i)=>sums[i]+=v);spent+=total;const tr=element('tr');[labelDate(date),...vals.map(fmt),fmt(total)].forEach(v=>tr.append(element('td','',v)));body.append(tr);const t=document.querySelector(`[data-total="${date}"]`);if(t)t.textContent=`日計 ${fmt(total)}`;MEALS.forEach(([key],i)=>{const e=document.querySelector(`[data-subtotal="${date}:${key}"]`);if(e)e.textContent=`小計 ${fmt(vals[i])}`})}
const received=amount(state.received),budget=amount(state.budget),remain=budget-spent,returned=received-spent;
[['sReceived',received],['sBudget',budget],['sSpent',spent],['sRemaining',remain],['sReturn',returned],['tMorning',sums[0]],['tLunch',sums[1]],['tDinner',sums[2]],['tAll',spent]].forEach(([id,v])=>$(id).textContent=fmt(v));$('sDays').textContent=list.length+'日';$('remainingBox').classList.toggle('danger',remain<0);const s=$('status');s.classList.toggle('bad',remain<0);s.textContent=!list.length?'日付を確認してください':remain<0?`⚠ 使用予定金額を ${fmt(-remain)} 超過しています`: `✓ 使用予定金額の範囲内です（残り ${fmt(remain)}）`}
['start','end','received','budget'].forEach(id=>{const el=$(id);el.value=state[id]??'';el.addEventListener('change',()=>{state[id]=el.value;save();if(id==='start'||id==='end')renderDays();else update()});if(id==='received'||id==='budget')el.addEventListener('input',()=>{state[id]=el.value;save();update()})});
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$('csv').addEventListener('click',()=>{const rows=[['日付','曜日','食事','商品名','価格']];for(const date of dates()){for(const [key,title] of MEALS){for(const x of items(date,key)){rows.push([date,'日月火水木金土'[parseDate(date).getDay()],title,x.name??'',amount(x.price)])}}}rows.push([]);rows.push(['受領金額',amount(state.received)],['使用予定金額',amount(state.budget)],['使用済金額',dates().reduce((s,d)=>s+MEALS.reduce((v,[k])=>v+subtotal(d,k),0),0)]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(`食費_${state.start}_${state.end}.csv`,csv,'text/csv;charset=utf-8')});
$('backup').addEventListener('click',()=>download(`食費バックアップ_${localDate(new Date())}.json`,JSON.stringify(state,null,2),'application/json'));
$('restore').addEventListener('click',()=>$('restoreFile').click());$('restoreFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||typeof obj.days!=='object'||typeof obj.start!=='string'||typeof obj.end!=='string'||!parseDate(obj.start)||!parseDate(obj.end))throw Error();if(!confirm('現在のデータをバックアップの内容で置き換えますか？'))return;state=obj;save();['start','end','received','budget'].forEach(id=>$(id).value=state[id]??'');renderDays()}catch{alert('正しいバックアップファイルではありません。')}finally{e.target.value=''}});
$('reset').addEventListener('click',()=>{if(!confirm('すべての期間・予算・商品データを削除しますか？'))return;state={start:defaultStart,end:defaultEnd,received:'',budget:'',days:{}};save();['start','end','received','budget'].forEach(id=>$(id).value=state[id]);renderDays()});renderDays();
})();
</script></body></html>
